name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [dev, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    concurrency:
      group: deploy-api-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Validate composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist \
            --no-scripts

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='.git' --exclude='.github' \
            --exclude='storage/' --exclude='tests/' --exclude='node_modules/' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.API_PATH }}/

      - name: Post-deploy commands
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ vars.API_PATH }}
            PHP=/usr/local/bin/php

            # --- Sanity checks (fail loudly, never silently) ---
            test -f .env || { echo "❌ No .env on server at $(pwd)"; exit 1; }
            "$PHP" -v
            "$PHP" -m | grep -qi pdo_mysql || { echo "❌ pdo_mysql extension missing"; exit 1; }

            # --- Ensure dirs that were excluded from rsync exist and are writable ---
            mkdir -p \
              storage/framework/views \
              storage/framework/sessions \
              storage/framework/cache/data \
              bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # --- Clear stale caches FIRST so later artisan commands use live config ---
            "$PHP" artisan optimize:clear

            # --- Migrations ---
            "$PHP" artisan migrate --force --no-interaction

            # --- Storage symlink (idempotent) ---
            "$PHP" artisan storage:link || true

            # --- Warm caches LAST ---
            "$PHP" artisan config:cache
            "$PHP" artisan route:cache
            "$PHP" artisan view:cache

            # --- Restart queue workers ---
            "$PHP" artisan queue:restart || true
          EOF